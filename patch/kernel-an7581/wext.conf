# ==============================================================
# target/linux/airoha/an7581/config-6.18 追加片段
# 由 scripts/apply-mtwifi.sh 在 wifi_driver=mtwifi* 时幂等追加。
#
# 背景：闭源 mt_wifi (MT7916) 的控制面是 iwpriv / iwconfig，
# 走 SIOCIWFIRST..SIOCIWLAST 这组 ioctl。它们在 net/core/dev_ioctl.c
# 里被交给 wext_ioctl_dispatch()，而这个函数只存在于
# net/wireless/wext-core.c，编译条件是 CONFIG_WEXT_CORE。
#
#   net/wireless/Makefile:  obj-$(CONFIG_WEXT_CORE) += wext-core.o
#
# 不开的话驱动能加载、网卡能起来，但没有任何手段能配置它。
#
# 为什么这四行必须配 patch/kernel-generic/299-add-wext-kconfig-prompts.patch
# 一起用（实测结论，不是推测）：
#   upstream 里 WIRELESS_EXT 和 WEXT_PRIV 都是【没有 prompt 的隐藏 bool】，
#   直接写进 .config 会被 olddefconfig 静默丢掉。把 OpenWrt 自己合并出的
#   .config.target 喂给 make ARCH=arm64 olddefconfig 验证过：
#       不打补丁 -> 这四行全部消失，等于没配
#       打上补丁 -> 四个符号全部落到 =y
#   net/wireless/Kconfig 整段包在 net/Kconfig 的 `if WIRELESS` 里，
#   ponwrt 的 generic config 已经写了 CONFIG_WIRELESS=y，这条不用管。
#
# 另一个必要条件：CONFIG_WEXT_PRIV 不能被漏掉。
#   net/wireless/wext-core.c 里整条私有 ioctl 分发链在
#   #ifdef CONFIG_WEXT_PRIV 里面（含 handlers->private[] 和 SIOCGIWPRIV）。
#   替代路线 CONFIG_CFG80211_WEXT=y 能拿到 WEXT_CORE，但拿不到 WEXT_PRIV
#   —— 编译照样过、符号照样能解析，可 iwpriv 运行时一律 EOPNOTSUPP。
#
# 为什么不开 CFG80211：
#   mt_wifi 自带 MLME/AP，不走 cfg80211/mac80211。开了只会跟
#   kmod-mt7915e 那条链路抢包链。参考树（immortalwrt-mt798x）也是
#   "# CONFIG_CFG80211 is not set" + WEXT 四件套。
#
# 另一条硬约束：必须保持 CONFIG_PREEMPT_NONE
#   可抢占内核会生成 preempt_schedule_notrace 调用（EXPORT_SYMBOL_GPL），
#   Proprietary 的 mt_wifi.ko 过不了 modpost 的 GPL 检查。
#   apply-mtwifi.sh 会校验这一项。
# ==============================================================

CONFIG_WIRELESS_EXT=y
CONFIG_WEXT_CORE=y
CONFIG_WEXT_PRIV=y
CONFIG_WEXT_PROC=y
